<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroFit — Control de Clientes</title>
  <style>
    :root {
      --bg: #f1a960;
      --surface: #ffb349;
      --border: #e8902c;
      --primary: #f97316;
      --primary-hover: #ea580c;
      --primary-soft: #e68f1e;
      --danger: #dc2626;
      --success: #16a34a;
      --text: #1c1917;
      --text-muted: #78716c;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.08);
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      padding: 10px 20px;
      border-radius: var(--radius);
      text-align: center;
    }

    .stat-card span {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-hover);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card strong {
      font-size: 1.5rem;
      color: var(--text);
    }

    .btn-money-section {
      background: var(--surface);
      color: var(--primary-hover);
      border: 2px solid var(--primary);
      padding: 10px 16px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-money-section:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 880px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.05);
    }

    .card h2 {
      font-size: 1.2rem;
      color: var(--primary-hover);
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      background: #ffffff;
      border: 1.5px solid #d6d3d1;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      display: none;
      line-height: 1.4;
      font-weight: 500;
    }

    .alert.error {
      display: block;
      background: #fef2f2;
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .alert.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid var(--success);
      color: var(--success);
    }

    .search-header {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-box input {
      padding-left: 38px;
      font-size: 1rem;
      border-color: var(--primary);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
    }

    .filter-select {
      width: auto;
      min-width: 160px;
    }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .client-item {
      background: #fffaf5;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .client-item:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.1);
    }

    .client-info h3 {
      font-size: 1.08rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--text);
    }

    .credential-tag {
      background: var(--primary-soft);
      color: var(--primary-hover);
      border: 1px solid var(--border);
      font-size: 0.76rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .days-badge {
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .days-badge.ok {
      background: #dcfce7;
      color: #15803d;
    }

    .days-badge.warning {
      background: #ffedd5;
      color: #c2410c;
    }

    .days-badge.expired {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-today {
      background: var(--primary);
      color: #ffffff;
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .client-meta {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 6px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .client-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-sm {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-checkin {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-checkin:hover {
      background: var(--primary-hover);
    }

    .btn-checkin.checked {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-renew {
      background: #ffffff;
      color: var(--primary-hover);
      border: 1.5px solid var(--primary);
    }

    .btn-renew:hover {
      background: var(--primary-soft);
    }

    .btn-delete {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: #ffffff;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      color: var(--primary-hover);
      font-size: 1.25rem;
    }

    .btn-close {
      background: #fee2e2;
      color: var(--danger);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .money-summary {
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .money-summary strong {
      font-size: 1.4rem;
      color: var(--primary-hover);
    }

    .money-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .money-table th, .money-table td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    .money-table th {
      background: #fffaf5;
      color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>🧡 AeroFit</h1>
      </div>

      <div class="header-right">
        <div class="stat-card">
          <span>Asistencia de Hoy</span>
          <strong id="statToday">0</strong>
        </div>

        <button type="button" class="btn-money-section" onclick="openMoneyModal()">
          💵 Ver Registro de Dinero
        </button>
      </div>
    </header>

    <div class="main-grid">
      <section class="card">
        <h2>➕ Registrar Cliente</h2>
        <div id="alertBox" class="alert"></div>
        <form id="clientForm">
          <div class="form-group">
            <label for="fullName">Nombre del Cliente *</label>
            <input type="text" id="fullName" placeholder="Ej. Carlos Mendoza" required autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="credential">Credencial / Identificador *</label>
            <input type="text" id="credential" placeholder="Ej. DUI, Teléfono o Apodo" required autocomplete="off" />
          </div>
          <div class="form-group">
            <label for="planDuration">Días de Membresía</label>
            <select id="planDuration">
              <option value="1">1 día (Visita)</option>
              <option value="7">7 días (Semana)</option>
              <option value="15">15 días (Quincena)</option>
              <option value="30" selected>30 días (Mes)</option>
              <option value="90">90 días (Trimestre)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amountPaid">¿Cuánto dejó de dinero? ($) *</label>
            <input type="number" id="amountPaid" step="0.01" min="0" placeholder="Ej. 15.00" required />
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Guardar Cliente</button>
        </form>
      </section>

      <section class="card">
        <h2>🔎 Buscar Cliente</h2>
        <div class="search-header">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe el nombre del cliente..." autocomplete="off" />
          </div>
          <select id="statusFilter" class="filter-select">
            <option value="all">Todos los clientes</option>
            <option value="active">Con días vigentes</option>
            <option value="expired">Vencidos (0 días)</option>
            <option value="today">Vinieron Hoy</option>
          </select>
        </div>
        <div id="clientList" class="client-list"></div>
      </section>
    </div>
  </div>

  <div id="moneyModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>💵 Apartado de Dinero — AeroFit</h2>
        <button type="button" class="btn-close" onclick="closeMoneyModal()">Cerrar ✕</button>
      </div>
      <div class="money-summary">
        <span>Total recaudado registrado:</span>
        <strong id="totalMoneyDisplay">$0.00</strong>
      </div>
      <table class="money-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Concepto</th>
            <th>Monto</th>
          </tr>
        </thead>
        <tbody id="moneyTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ============================================
    // CONFIGURACIÓN DE SUPABASE
    // ============================================
    const SUPABASE_URL = 'https://eqefyxzfxsidnftlbteq.supabase.co'; // Revisa que no tenga espacios
    const SUPABASE_ANON_KEY = 'sb_publishable_cPxIRUZcKM1z5ZxbSCj8wg_c3tY3VqwW';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MAX_CAPACITY = 300;
    let clients = [];
    let payments = [];

    const clientForm = document.getElementById('clientForm');
    const fullNameInput = document.getElementById('fullName');
    const credentialInput = document.getElementById('credential');
    const planDurationInput = document.getElementById('planDuration');
    const amountPaidInput = document.getElementById('amountPaid');
    const alertBox = document.getElementById('alertBox');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const clientListEl = document.getElementById('clientList');
    const statToday = document.getElementById('statToday');
    const moneyModal = document.getElementById('moneyModal');
    const totalMoneyDisplay = document.getElementById('totalMoneyDisplay');
    const moneyTableBody = document.getElementById('moneyTableBody');

    function normalizeText(str) {
      return str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
    }

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function addDays(dateStr, days) {
      const date = new Date(dateStr + 'T00:00:00');
      date.setDate(date.getDate() + Number(days));
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDaysRemaining(endDateStr) {
      const today = new Date(getTodayString() + 'T00:00:00');
      const end = new Date(endDateStr + 'T00:00:00');
      const diff = end - today;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      if (type === 'success') {
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
      }
    }

    // ============================================
    // CARGAR DATOS
    // ============================================
    async function loadData() {
      const { data: clientsData, error: clientsError } = await supabaseClient
        .from('clients')
        .select('*')
        .order('created_at', { ascending: false });

      if (clientsError) {
        alert('Error al cargar clientes:\n' + clientsError.message);
      } else {
        clients = clientsData || [];
      }

      const { data: paymentsData, error: paymentsError } = await supabaseClient
        .from('payments')
        .select('*')
        .order('created_at', { ascending: false });

      if (paymentsError) {
        alert('Error al cargar pagos:\n' + paymentsError.message);
      } else {
        payments = paymentsData || [];
      }

      updateStats();
      renderClients();
    }

    function updateStats() {
      const today = getTodayString();
      const todayCount = clients.filter(c => c.attendance_dates && c.attendance_dates.includes(today)).length;
      statToday.textContent = todayCount;
    }

    // ============================================
    // REGISTRAR CLIENTE
    // ============================================
    clientForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      if (clients.length >= MAX_CAPACITY) {
        showAlert(`⚠️ Se alcanzó el límite de ${MAX_CAPACITY} clientes.`, 'error');
        return;
      }

      const rawName = fullNameInput.value.trim();
      const rawCredential = credentialInput.value.trim();
      const duration = parseInt(planDurationInput.value, 10);
      const amount = parseFloat(amountPaidInput.value);

      if (!rawName || !rawCredential || isNaN(amount)) {
        showAlert('Completa todos los campos obligatorios.', 'error');
        return;
      }

      const normName = normalizeText(rawName);
      const normCred = normalizeText(rawCredential);

      if (clients.some(c => normalizeText(c.name) === normName)) {
        showAlert(`⚠️ El nombre "${rawName}" ya existe.`, 'error');
        return;
      }
      if (clients.some(c => normalizeText(c.credential) === normCred)) {
        showAlert(`⚠️ La credencial "${rawCredential}" ya está en uso.`, 'error');
        return;
      }

      const today = getTodayString();
      const endDate = addDays(today, duration);

      const { error: clientError } = await supabaseClient
        .from('clients')
        .insert([{
          name: rawName,
          credential: rawCredential,
          start_date: today,
          end_date: endDate,
          attendance_dates: [today]
        }]);

      if (clientError) {
        alert('ERROR SUPABASE (Cliente):\n' + clientError.message + '\nCódigo: ' + clientError.code);
        return;
      }

      const { error: paymentError } = await supabaseClient
        .from('payments')
        .insert([{
          date: today,
          client_name: rawName,
          concept: `Inscripción (${duration} días)`,
          amount: amount
        }]);

      if (paymentError) {
        alert('ERROR SUPABASE (Pago):\n' + paymentError.message);
      }

      await loadData();
      clientForm.reset();
      planDurationInput.value = '30';
      showAlert(`✅ Cliente "${rawName}" guardado exitosamente.`, 'success');
    });

    // ============================================
    // MARCAR ASISTENCIA
    // ============================================
    window.toggleCheckIn = async function(id) {
      const today = getTodayString();
      const client = clients.find(c => c.id === id);
      if (!client) return;

      let attendanceDates = client.attendance_dates || [];
      const idx = attendanceDates.indexOf(today);

      if (idx === -1) attendanceDates.push(today);
      else attendanceDates.splice(idx, 1);

      const { error } = await supabaseClient
        .from('clients')
        .update({ attendance_dates: attendanceDates })
        .eq('id', id);

      if (error) {
        alert('Error al actualizar asistencia:\n' + error.message);
        return;
      }
      await loadData();
    };

    // ============================================
    // RENOVAR CLIENTE
    // ============================================
    window.renewClient = async function(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;

      const daysStr = prompt(`¿Cuántos días deseas agregarle a ${client.name}?`, '30');
      if (!daysStr) return;
      const days = parseInt(daysStr, 10);
      if (isNaN(days) || days <= 0) { alert('Número de días inválido.'); return; }

      const moneyStr = prompt(`¿Cuánto dejó de dinero ${client.name}? ($)`, '15');
      const amount = parseFloat(moneyStr);
      if (isNaN(amount) || amount < 0) { alert('Monto inválido.'); return; }

      const today = getTodayString();
      const baseDate = getDaysRemaining(client.end_date) > 0 ? client.end_date : today;
      const newEndDate = addDays(baseDate, days);

      const { error: updateError } = await supabaseClient
        .from('clients')
        .update({ end_date: newEndDate })
        .eq('id', id);

      if (updateError) { alert('Error al renovar:\n' + updateError.message); return; }

      const { error: paymentError } = await supabaseClient
        .from('payments')
        .insert([{ date: today, client_name: client.name, concept: `Renovación (+${days} días)`, amount: amount }]);

      if (paymentError) alert('Error al guardar pago:\n' + paymentError.message);

      await loadData();
    };

    // ============================================
    // ELIMINAR CLIENTE
    // ============================================
    window.deleteClient = async function(id) {
      const client = clients.find(c => c.id === id);
      if (!client) return;

      if (confirm(`¿Seguro que deseas eliminar a "${client.name}"?`)) {
        const { error } = await supabaseClient.from('clients').delete().eq('id', id);
        if (error) { alert('Error al eliminar:\n' + error.message); return; }
        await loadData();
      }
    };

    // ============================================
    // MODAL DE DINERO
    // ============================================
    window.openMoneyModal = function() {
      const total = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
      totalMoneyDisplay.textContent = `$${total.toFixed(2)}`;

      if (payments.length === 0) {
        moneyTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px;">Aún no hay registros.</td></tr>`;
      } else {
        moneyTableBody.innerHTML = payments.map(p => `
          <tr>
            <td>${p.date}</td>
            <td><strong>${p.client_name}</strong></td>
            <td>${p.concept}</td>
            <td style="color: var(--primary-hover); font-weight: 700;">$${Number(p.amount).toFixed(2)}</td>
          </tr>
        `).join('');
      }
      moneyModal.classList.add('open');
    };

    window.closeMoneyModal = function() {
      moneyModal.classList.remove('open');
    };

    moneyModal.addEventListener('click', (e) => {
      if (e.target === moneyModal) closeMoneyModal();
    });

    // ============================================
    // RENDERIZAR CLIENTES
    // ============================================
    function renderClients() {
      const query = normalizeText(searchInput.value);
      const filter = statusFilter.value;
      const today = getTodayString();

      const filtered = clients.filter(client => {
        const matchesQuery = normalizeText(client.name).includes(query) || normalizeText(client.credential).includes(query);
        if (!matchesQuery) return false;

        const daysLeft = getDaysRemaining(client.end_date);
        const cameToday = client.attendance_dates && client.attendance_dates.includes(today);

        if (filter === 'active') return daysLeft > 0;
        if (filter === 'expired') return daysLeft <= 0;
        if (filter === 'today') return cameToday;
        return true;
      });

      if (filtered.length === 0) {
        clientListEl.innerHTML = `<div class="empty-state">${clients.length === 0 ? 'No hay clientes registrados.' : 'No se encontró ningún cliente.'}</div>`;
        return;
      }

      clientListEl.innerHTML = filtered.map(client => {
        const daysLeft = getDaysRemaining(client.end_date);
        const cameToday = client.attendance_dates && client.attendance_dates.includes(today);
        const totalVisits = client.attendance_dates ? client.attendance_dates.length : 0;

        let daysLabel = '';
        let badgeClass = 'ok';

        if (daysLeft > 5) { daysLabel = `⏳ Le quedan ${daysLeft} días`; badgeClass = 'ok'; }
        else if (daysLeft > 1) { daysLabel = `⚠️ Le quedan ${daysLeft} días`; badgeClass = 'warning'; }
        else if (daysLeft === 1) { daysLabel = `⚠️ Le queda 1 día`; badgeClass = 'warning'; }
        else if (daysLeft === 0) { daysLabel = `❗ Vence hoy`; badgeClass = 'expired'; }
        else { daysLabel = `❌ Vencido (hace ${Math.abs(daysLeft)} día${Math.abs(daysLeft) === 1 ? '' : 's'})`; badgeClass = 'expired'; }

        return `
          <div class="client-item">
            <div class="client-info">
              <h3>
                ${client.name}
                <span class="credential-tag">ID: ${client.credential}</span>
                <span class="days-badge ${badgeClass}">${daysLabel}</span>
                ${cameToday ? '<span class="badge-today">✔ Vino hoy</span>' : ''}
              </h3>
              <div class="client-meta">
                <span>📅 Vence el: ${client.end_date}</span>
                <span>🏋️‍♂️ Asistencias: ${totalVisits}</span>
              </div>
            </div>
            <div class="client-actions">
              <button class="btn-sm btn-checkin ${cameToday ? 'checked' : ''}" onclick="toggleCheckIn('${client.id}')">
                ${cameToday ? '✔ Asistió Hoy' : 'Marcar Asistencia'}
              </button>
              <button class="btn-sm btn-renew" onclick="renewClient('${client.id}')">+ Renovar</button>
              <button class="btn-sm btn-delete" onclick="deleteClient('${client.id}')" title="Eliminar">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderClients);
    statusFilter.addEventListener('change', renderClients);

    // Iniciar la app
    loadData();
  </script>
</body>
</html>
